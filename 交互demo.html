<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xG 射门实验</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f9f8;color:#253730;font:15px "Microsoft YaHei",sans-serif}main{max-width:1000px;margin:auto;padding:24px}header{border-bottom:1px solid #cbd9d1;margin-bottom:24px}h1{font-size:26px}.layout{display:grid;grid-template-columns:1fr 290px;gap:24px}canvas{width:100%;aspect-ratio:62/80;display:block;background:#e6efe9;touch-action:none}label{display:block;margin:15px 0 5px}select,input[type=number]{width:100%;padding:9px;border:1px solid #a9beb0;border-radius:4px;background:white}input[type=checkbox]{margin-right:8px}output{display:block;font-size:44px;color:#176c55;margin:18px 0}button{padding:10px 16px;background:#176c55;color:white;border:0;border-radius:4px;cursor:pointer}small{display:block;color:#5a6b63;line-height:1.7}.coords{display:grid;grid-template-columns:1fr 1fr;gap:10px}#example{font-size:14px;line-height:1.7;margin-top:14px}footer{margin-top:24px;border-top:1px solid #cbd9d1;padding-top:12px;font-size:12px}@media(max-width:650px){.layout{grid-template-columns:1fr}main{padding:16px}h1{font-size:23px}canvas{max-height:460px}}</style><main><header><h1>足球 xG · 射门实验</h1><p>2015/16 英超 · 实际训练的逻辑回归模型</p></header><div class="layout"><canvas id="pitch" width="620" height="800" aria-label="射门位置" tabindex="0"></canvas><section><label>预测进球概率</label><output id="prob"></output><div class="coords"><div><label for="x">x 坐标</label><input id="x" type="number" min="60" max="119.9" step="0.1" value="108"></div><div><label for="y">y 坐标</label><input id="y" type="number" min="0" max="80" step="0.1" value="40"></div></div><label for="body">射门部位</label><select id="body"></select><label for="type">射门类型</label><select id="type"></select><label><input id="pressure" type="checkbox">受压</label><label><input id="first" type="checkbox">直接射门（first time）</label><small id="geometry"></small><label for="examples" style="display:none">测试集真实射门</label><select id="examples" style="display:none"><option value="">自定义</option></select><div id="example"></div></section></div><footer>数据：StatsBomb Open Data · 主模型不含点球；点球模式使用训练数据的 Beta(1,1) 后验预测。场地为标准化坐标，模型适用范围与验证结果见案例文档。</footer></main><script>const M={"features": ["numeric__distance", "numeric__angle", "category__body_part_Head", "category__body_part_Left Foot", "category__body_part_Other", "category__body_part_Right Foot", "category__shot_type_Free Kick", "category__shot_type_Open Play", "binary__under_pressure", "binary__first_time"], "coef": [-0.9846423193519167, 0.35151696881801536, -1.2142400773508664, -0.20535157803475088, 0.002449587477879666, 0.06620551031393637, -0.350805478607767, -1.000131078986028, -0.28800588185356907, -0.28755265036806965], "intercept": -1.3697108925914137, "numeric_mean": [19.26213913827345, 0.43875070304717556], "numeric_scale": [8.32376025054675, 0.276736931347652], "categories": [["Head", "Left Foot", "Other", "Right Foot"], ["Free Kick", "Open Play"]], "calibration_slope": 0.7773074359230836, "calibration_intercept": -0.4604026344994959, "penalty_probability": 0.8421052631578947},E=[];const $=id=>document.getElementById(id),c=$('pitch'),ctx=c.getContext('2d');for(const [id,cats] of [['body',M.categories[0]],['type',[...M.categories[1],'Penalty']]])for(const t of cats){const o=new Option(t,t);$(id).add(o)}$('body').value='Right Foot';$('type').value='Open Play';E.forEach((e,i)=>$('examples').add(new Option(`${e.home} vs ${e.away} · ${e.minute}′`,i)));let point={x:108,y:40};
function predict(x,y,b,t,u,f){const dx=120-x,d=Math.hypot(dx,y-40),a=Math.atan2(8*Math.abs(dx),dx*dx+(36-y)*(44-y));let z=M.intercept,k=0;[d,a].forEach((v,j)=>z+=(v-M.numeric_mean[j])/M.numeric_scale[j]*M.coef[k++]);[b,t].forEach((v,j)=>M.categories[j].forEach(cat=>z+=(v===cat?1:0)*M.coef[k++]));z+=u*M.coef[k++]+f*M.coef[k++];return {p:t==='Penalty'?M.penalty_probability:1/(1+Math.exp(-z)),d,a}}
function line(points,color='#6c927b',width=2){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo((x-60)*10,y*10):ctx.moveTo((x-60)*10,y*10));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function draw(){ctx.clearRect(0,0,620,800);for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#e1ece4':'#e9f1ec';ctx.fillRect(i*100,0,100,800)}line([[60,0],[120,0],[120,80],[60,80],[60,0]]);line([[120,18],[102,18],[102,62],[120,62]]);line([[120,30],[114,30],[114,50],[120,50]]);line([[120,36],[120,44]],'#203d2c',7);line([[point.x,point.y],[120,36]],'#4981a0',2);line([[point.x,point.y],[120,44]],'#4981a0',2);ctx.beginPath();ctx.arc((point.x-60)*10,point.y*10,9,0,Math.PI*2);ctx.fillStyle='#c03e47';ctx.fill()}
function update(){point.x=Math.max(60,Math.min(119.9,Number($('x').value)));point.y=Math.max(0,Math.min(80,Number($('y').value)));const r=predict(point.x,point.y,$('body').value,$('type').value,+$('pressure').checked,+$('first').checked);$('prob').textContent=(100*r.p).toFixed(1)+'%';$('geometry').textContent=`距离 ${r.d.toFixed(1)} 坐标单位 · 射门角 ${(r.a*180/Math.PI).toFixed(1)}°`;$('x').disabled=$('y').disabled=$('body').disabled=$('pressure').disabled=$('first').disabled=$('type').value==='Penalty';if($('type').value==='Penalty'){point={x:108,y:40};$('x').value=108;$('y').value=40;$('geometry').textContent='点球固定位置 · 不区分球员能力'}draw()}
['x','y','body','type','pressure','first'].forEach(id=>$(id).addEventListener('input',()=>{$('examples').value='';$('example').textContent='';update()}));let down=false;c.addEventListener('pointerdown',ev=>{down=true;c.setPointerCapture(ev.pointerId);move(ev)});c.addEventListener('pointermove',ev=>{if(down)move(ev)});c.addEventListener('pointerup',()=>down=false);function move(ev){if($('type').value==='Penalty')return;const b=c.getBoundingClientRect();$('x').value=(60+(ev.clientX-b.left)/b.width*62).toFixed(1);$('y').value=((ev.clientY-b.top)/b.height*80).toFixed(1);$('examples').value='';$('example').textContent='';update()}
$('examples').addEventListener('change',()=>{if($('examples').value==='')return;const e=E[+$('examples').value];$('x').value=e.x;$('y').value=e.y;$('body').value=e.body_part;$('type').value=e.shot_type;$('pressure').checked=!!e.under_pressure;$('first').checked=!!e.first_time;update();$('example').textContent=`真实结果：${e.goal?'进球':'未进球'} · 保存的测试预测 ${(100*e.xg).toFixed(1)}%`});for(const e of E){if(Math.abs(predict(e.x,e.y,e.body_part,e.shot_type,e.under_pressure,e.first_time).p-e.xg)>1e-10)throw Error('模型参数验证失败')}update();</script></html>
